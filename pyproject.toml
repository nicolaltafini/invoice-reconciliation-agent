[project]
name = "reconciliation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nicolaltafini", email = "nicola.altafini06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "mcp>=2,<3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
reconciliation = "reconciliation:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]
