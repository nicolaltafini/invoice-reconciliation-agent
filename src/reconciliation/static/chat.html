<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controllo fatture passive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --paper: #F4F6F5;
    --sheet: #FFFFFF;
    --ink: #1C2B3A;
    --muted: #5A6A77;
    --rule: #DDE3E7;
    --ledger: #2E6A54;
    --ledger-soft: #E4F0EA;
    --alert: #A5322A;
    --alert-soft: #F7E5E3;
    --wait-soft: #ECEFF2;
    --focus: #2F5D8C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Public Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
    background: var(--paper);
    color: var(--ink);
  }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  textarea:focus-visible { outline: none; }

  header { background: var(--sheet); border-bottom: 1px solid var(--rule); }
  .header-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
  .user-switch { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
  .user-switch select {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px;
    padding: 6px 10px; color: var(--ink); cursor: pointer;
  }

  .layout {
    max-width: 1180px; margin: 0 auto; padding: 24px;
    display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    .panel { position: static; }
  }

  .panel {
    position: sticky; top: 24px; align-self: start;
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 16px; border-bottom: 1px solid var(--rule);
  }
  .panel-head h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
  .panel-head span { color: var(--muted); font-size: 0.85rem; }
  .invoice-list { list-style: none; margin: 0; padding: 0; }
  .invoice-list button {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    border-bottom: 1px solid var(--rule); padding: 11px 16px;
    display: grid; grid-template-columns: 1fr auto; gap: 1px 12px;
  }
  .invoice-list button:hover { background: var(--paper); }
  .inv-number { font-weight: 600; }
  .inv-supplier { color: var(--muted); font-size: 0.85rem; }
  .inv-risk { grid-column: 2; grid-row: 2; text-align: right; font-size: 0.85rem; color: var(--muted); }
  .inv-risk.positive { color: var(--alert); font-weight: 600; }
  .badge {
    grid-column: 2; grid-row: 1; justify-self: end;
    font-size: 0.75rem; font-weight: 600; padding: 1px 9px; border-radius: 999px;
  }
  .badge.ok { background: var(--ledger-soft); color: var(--ledger); }
  .badge.alert { background: var(--alert-soft); color: var(--alert); }
  .badge.wait { background: var(--wait-soft); color: var(--muted); }
  .badge.approved { background: var(--ledger); color: #fff; }
  .badge.blocked { background: var(--alert); color: #fff; }
  .panel-foot {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 12px 16px; font-size: 0.9rem;
  }
  .panel-foot strong { color: var(--alert); font-size: 1.05rem; }
  .panel-note { padding: 14px 16px; color: var(--muted); font-size: 0.9rem; margin: 0; }

  .chat { display: flex; flex-direction: column; min-height: calc(100vh - 130px); }
  #log { flex: 1; }
  .empty { padding: 8px 0 24px; }
  .empty h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .empty p { margin: 0 0 14px; color: var(--muted); }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggestions button {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
  }
  .suggestions button:hover { border-color: var(--ink); }

  .msg { margin: 0 0 18px; }
  .msg.user .bubble {
    width: fit-content; max-width: 80%; margin-left: auto;
    background: var(--ink); color: #fff;
    padding: 9px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap;
  }
  .msg.assistant .bubble {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px;
    padding: 12px 18px;
  }
  .msg.pending .bubble { color: var(--muted); }
  .msg.failed .bubble { border-color: var(--alert); color: var(--alert); }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble p { margin: 0.5em 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 1rem; margin: 0.8em 0 0.3em; }
  .bubble ul, .bubble ol { padding-left: 1.2em; margin: 0.5em 0; }
  .bubble table {
    display: block; max-width: 100%; overflow-x: auto;
    border-collapse: collapse; margin: 10px 0; font-size: 0.9rem;
  }
  .bubble th, .bubble td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--rule); }
  .bubble th { color: var(--muted); font-weight: 600; }
  .bubble td { white-space: nowrap; }

  .trace { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
  .stamp {
    border: 1.5px solid var(--ledger); color: var(--ledger);
    padding: 0 8px; border-radius: 3px; font-weight: 600; transform: rotate(-1.5deg);
  }
  .stamp.error { border-color: var(--alert); color: var(--alert); }

  form { position: sticky; bottom: 0; padding: 16px 0 20px; background: linear-gradient(to bottom, transparent, var(--paper) 30%); }
  .composer {
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 6px;
  }
  .composer:focus-within { border-color: var(--focus); }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent;
    font: inherit; color: var(--ink); padding: 9px 10px; max-height: 160px; overflow-y: hidden;
  }
  #send {
    background: var(--ledger); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 18px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: wait; }
  .hint { margin: 6px 4px 0; font-size: 0.78rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .stamp { transform: none; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <h1>Controllo fatture passive</h1>
      <p>Fatture, DDT e ordini a confronto. Chiedi quali fatture non tornano e perché.</p>
    </div>
    <div class="user-switch">
      <label for="user">Utente demo</label>
      <select id="user"></select>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="panel" aria-label="Fatture ricevute">
    <div class="panel-head">
      <h2>Fatture</h2>
      <span id="invoice-count"></span>
    </div>
    <ul class="invoice-list" id="invoice-list"></ul>
    <div class="panel-foot" id="panel-foot" hidden>
      <span>Totale a rischio</span>
      <strong id="total-risk"></strong>
    </div>
    <p class="panel-note" id="panel-note">Caricamento fatture…</p>
  </aside>

  <main class="chat">
    <div id="log"></div>

    <form id="ask">
      <div class="composer">
        <label for="question" hidden>Domanda</label>
        <textarea id="question" rows="1" placeholder="Scrivi una domanda sulle fatture" required></textarea>
        <button id="send" type="submit">Chiedi</button>
      </div>
      <p class="hint">Invio per chiedere, Maiusc + Invio per andare a capo.</p>
    </form>
  </main>
</div>

<template id="empty-template">
  <section class="empty">
    <h2>Da dove vuoi partire?</h2>
    <p>Scegli una fattura dal pannello o parti da una di queste domande.</p>
    <div class="suggestions">
      <button type="button">Quali fatture hanno anomalie e quanto rischio di pagare in più?</button>
      <button type="button">Perché la fattura EM/26/1022 non torna? Confrontala con l'ordine.</button>
      <button type="button">Approva la fattura FA-2026/0145.</button>
    </div>
  </section>
</template>

<script>
  const TOOL_LABELS = {
    list_reconciliations: "Elenco riconciliazioni",
    get_reconciliation: "Dettaglio fattura",
    get_purchase_order: "Ordine d'acquisto",
    approve_invoice: "Approvazione",
    block_invoice: "Blocco",
  };
  const RECONCILIATION = {
    MATCHED: { label: "In regola", css: "ok" },
    DISCREPANCIES: { label: "Anomalie", css: "alert" },
    WAITING_FOR_DDT: { label: "Manca DDT", css: "wait" },
  };
  const APPROVAL = {
    APPROVED: { label: "Approvata", css: "approved" },
    BLOCKED: { label: "Bloccata", css: "blocked" },
  };
  const ROLE_LABELS = { viewer: "consultazione", operator: "operatore" };
  const euro = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });

  const history = [];
  const log = document.getElementById("log");
  const form = document.getElementById("ask");
  const input = document.getElementById("question");
  const send = document.getElementById("send");
  const userSelect = document.getElementById("user");

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function showEmptyState() {
    history.length = 0;
    log.replaceChildren(document.getElementById("empty-template").content.cloneNode(true));
    log.querySelectorAll(".suggestions button").forEach((button) => {
      button.addEventListener("click", () => ask(button.textContent));
    });
  }

  async function loadUsers() {
    const response = await fetch("/api/users");
    const users = await response.json();
    for (const user of users) {
      const option = el("option", null, `${user.name} (${ROLE_LABELS[user.role] || user.role})`);
      option.value = user.id;
      userSelect.append(option);
    }
  }

  async function loadInvoices() {
    const list = document.getElementById("invoice-list");
    const note = document.getElementById("panel-note");
    try {
      const response = await fetch("/reconciliations");
      if (!response.ok) throw new Error();
      const rows = await response.json();

      list.replaceChildren();
      let total = 0;
      for (const row of rows) {
        const risk = Number(row.amount_at_risk);
        total += risk;
        const badge = APPROVAL[row.approval_status] || RECONCILIATION[row.status] || { label: row.status, css: "wait" };

        const button = el("button");
        button.type = "button";
        button.append(
          el("span", "inv-number", row.invoice_number),
          el("span", `badge ${badge.css}`, badge.label),
          el("span", "inv-supplier", row.supplier_name),
          el("span", "inv-risk" + (risk > 0 ? " positive" : ""), risk > 0 ? euro.format(risk) : "—"),
        );
        button.addEventListener("click", () => {
          const question = row.status === "MATCHED"
            ? `Riepilogami la fattura ${row.invoice_number}.`
            : `Perché la fattura ${row.invoice_number} non torna? Confrontala con l'ordine.`;
          ask(question);
        });

        const item = el("li");
        item.append(button);
        list.append(item);
      }

      document.getElementById("invoice-count").textContent = `${rows.length} ricevute`;
      document.getElementById("total-risk").textContent = euro.format(total);
      document.getElementById("panel-foot").hidden = rows.length === 0;
      note.hidden = rows.length > 0;
      note.textContent = "Nessuna fattura caricata.";
    } catch {
      note.hidden = false;
      note.textContent = "Fatture non caricate: controlla che il server sia acceso e ricarica la pagina.";
    }
  }

  function addMessage(role, text, options = {}) {
    const message = el("div", `msg ${role}` + (options.state ? ` ${options.state}` : ""));
    const bubble = el("div", "bubble");
    if (role === "assistant") {
      bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
    } else {
      bubble.textContent = text;
    }
    message.append(bubble);

    if (options.toolCalls && options.toolCalls.length) {
      const trace = el("div", "trace", "Dati consultati:");
      for (const call of options.toolCalls) {
        const stamp = el("span", "stamp" + (call.is_error ? " error" : ""), TOOL_LABELS[call.name] || call.name);
        stamp.title = JSON.stringify(call.arguments);
        trace.append(stamp);
      }
      message.append(trace);
    }

    log.append(message);
    message.scrollIntoView({ block: "end" });
    return message;
  }

  async function ask(question) {
    if (send.disabled) return;
    log.querySelector(".empty")?.remove();
    history.push({ role: "user", content: question });
    addMessage("user", question);
    const pending = addMessage("assistant", "Sto controllando fatture, DDT e ordini…", { state: "pending" });
    send.disabled = true;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userSelect.value, messages: history }),
      });
      const data = await response.json();
      pending.remove();
      if (!response.ok) {
        throw new Error(typeof data.detail === "string" ? data.detail : `errore ${response.status}`);
      }
      history.push({ role: "assistant", content: data.reply });
      addMessage("assistant", data.reply, { toolCalls: data.tool_calls });
      loadInvoices();
    } catch (error) {
      pending.remove();
      history.pop();
      addMessage("assistant", `Risposta non ricevuta: ${error.message}. Controlla che il server sia acceso e riprova.`, { state: "failed" });
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  function resizeInput() {
    input.style.height = "auto";
    input.style.height = `${input.scrollHeight}px`;
    input.style.overflowY = input.scrollHeight > 160 ? "auto" : "hidden";
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    resizeInput();
    ask(question);
  });

  input.addEventListener("input", resizeInput);
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  userSelect.addEventListener("change", showEmptyState);

  showEmptyState();
  loadUsers();
  loadInvoices();
</script>
</body>
</html>
