services:
  postgres:
    image: postgres:17
    container_name: reconciliation-db
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: